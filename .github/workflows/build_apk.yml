name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Make sure google-services.json is present
        run: |
          if [ ! -f google-services.json ]; then
            echo "::error::google-services.json not found at the repo root. Download it from Firebase Console (Project settings -> Your apps -> Android app) and commit it at the repo root before pushing."
            exit 1
          fi

      - name: Generate the Android platform folder
        run: flutter create --platforms=android --org com.ailifeorganizer --project-name ai_life_organizer .

      - name: Apply Android customizations (permissions + Firebase plugin)
        run: |
          cp overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp google-services.json android/app/google-services.json

          if [ -f android/build.gradle.kts ]; then
            cat overrides/root_append.gradle.kts >> android/build.gradle.kts
          elif [ -f android/build.gradle ]; then
            cat overrides/root_append.gradle >> android/build.gradle
          else
            cp overrides/root_append.gradle android/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            cat overrides/app_append.gradle.kts >> android/app/build.gradle.kts
          else
            cat overrides/app_append.gradle >> android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
